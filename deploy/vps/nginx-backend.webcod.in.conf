# /etc/nginx/sites-available/backend.webcod.in
server {
    server_name backend.webcod.in;
    listen 80;

    # Task-proof screenshot uploads are multipart up to ~10 MB;
    # nginx default (1 MB) would reject them with 413.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        # WebSocket upgrade — REQUIRED for the game's /api/ws/game connection
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
